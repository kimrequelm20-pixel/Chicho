<p>
Un breakcito…

Ese es el que dices que va a ser corto,
y termina siendo más largo.

Pero está bien.

Quédate un ratito más,
como cuando todo se siente un poquito “too much”,
pero igual no te quieres ir todavía.

No te apuro… te espero, siempre.

Pero apúrate!
Ya te extraño mucho!

Y toma agua!
Te veo.
</p>
